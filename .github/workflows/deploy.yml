# Publishes the site on GitHub Pages with data/ pulled from the private
# Hetzner bucket: data/ is not in git. The pre-push hook (.githooks/pre-push)
# uploads data/ before each push to main, which then runs this.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: data/ do bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: hel1
          # Hetzner rejects the CRC checksums newer AWS CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 sync s3://brasilumen/data/ data/ --endpoint-url https://hel1.your-objectstorage.com --no-progress
          test -s data/meta.json
          ls -la data | tail -n +2

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
